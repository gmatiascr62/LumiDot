name: Build LumiDot APK

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # Firma de release opcional. Configurá estos secrets en
      # Settings → Secrets and variables → Actions:
      #   LUMIDOT_KEYSTORE_BASE64, LUMIDOT_KEYSTORE_PASSWORD, LUMIDOT_KEY_ALIAS, LUMIDOT_KEY_PASSWORD
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMIDOT_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LUMIDOT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          LUMIDOT_KEYSTORE_PASSWORD: ${{ secrets.LUMIDOT_KEYSTORE_PASSWORD }}
          LUMIDOT_KEY_ALIAS: ${{ secrets.LUMIDOT_KEY_ALIAS }}
          LUMIDOT_KEY_PASSWORD: ${{ secrets.LUMIDOT_KEY_PASSWORD }}
        run: |
          TASKS="assembleDebug assembleRelease testDebugUnitTest"
          # El AAB (formato que exige Google Play) sólo sirve firmado con la clave de subida.
          if [ -n "${LUMIDOT_KEYSTORE_FILE:-}" ]; then TASKS="$TASKS bundleRelease"; fi
          ./gradlew --no-daemon --stacktrace $TASKS

      - name: Lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/LumiDot-debug.apk
          if ls app/build/outputs/apk/release/*-release.apk > /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*-release.apk out/LumiDot-release.apk
          else
            cp app/build/outputs/apk/release/*-release-unsigned.apk out/LumiDot-release-unsigned.apk
          fi
          if ls app/build/outputs/bundle/release/*.aab > /dev/null 2>&1; then
            cp app/build/outputs/bundle/release/*.aab out/LumiDot-release.aab
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: LumiDot-apk
          path: |
            out/*.apk
            out/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # Cada push a main publica/actualiza la pre-release "latest-build"
      # para poder descargar el APK desde el teléfono sin iniciar sesión.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" out/* --title "LumiDot $GITHUB_REF_NAME" --generate-notes || \
              gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release delete latest-build --yes --cleanup-tag || true
            gh release create latest-build out/* --prerelease --target "$GITHUB_SHA" \
              --title "LumiDot – última compilación (#${GITHUB_RUN_NUMBER})" \
              --notes "Compilación automática del commit ${GITHUB_SHA::7}. LumiDot-release.aab: para subir a Google Play Console. LumiDot-release.apk: instalación directa (firmada). LumiDot-debug.apk: sólo para diagnóstico."
          fi
